name: NexusRota Monthly Analytics Report

on:
  schedule:
    # Dia 1 de cada mes, 09:00 America/Sao_Paulo (12:00 UTC).
    - cron: "0 12 1 * *"
  workflow_dispatch: {} # allows manual "Run workflow" for testing

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install deps
        run: npm ci || npm install

      - name: Generate and send monthly report
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "803022098"
        run: node scripts/analytics-report.mjs
